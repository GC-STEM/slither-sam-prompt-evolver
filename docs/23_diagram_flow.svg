<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img"><title>Experiment control flow</title><desc>Planned flow. Paid work requires verified isolation and explicit limits; incomplete work stays partial.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#334155" /></marker></defs><rect width="100%" height="100%" fill="#ffffff" /><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,100 570.0,135" fill="none" stroke="#334155" /><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,195 570.0,235" fill="none" stroke="#334155" /><polyline stroke-width="2" marker-end="url(#arrow)" points="465,287.5 390,287 350,297.5" fill="none" stroke="#334155" /><rect x="415.5" y="265.25" width="24" height="20" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="427.5" y="279.25" fill="#334155">Yes</text><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,340 570.0,395" fill="none" stroke="#334155" /><rect x="562.0" y="345.5" width="16" height="20" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="570.0" y="359.5" fill="#334155">No</text><polyline stroke-width="2" marker-end="url(#arrow)" points="65,297.5 45,297 45,1340 420,1340.0" fill="none" stroke="#334155" /><rect x="17.0" y="796.5" width="56" height="20" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="45.0" y="810.5" fill="#334155">Offline</text><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,465 570.0,505" fill="none" stroke="#334155" /><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,575 570.0,615" fill="none" stroke="#334155" /><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,685 570.0,725" fill="none" stroke="#334155" /><polyline stroke-width="2" marker-end="url(#arrow)" points="685,782.5 805,782.5" fill="none" stroke="#334155" /><rect x="737.0" y="760.5" width="16" height="20" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="745.0" y="774.5" fill="#334155">No</text><polyline stroke-width="2" marker-end="url(#arrow)" points="1075,782.5 1110,782 1110,1340 720,1340.0" fill="none" stroke="#334155" /><rect x="1082.0" y="1039.0" width="56" height="20" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="1110.0" y="1053.0" fill="#334155">Partial</text><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,840 570.0,895" fill="none" stroke="#334155" /><rect x="558.0" y="845.5" width="24" height="20" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="570.0" y="859.5" fill="#334155">Yes</text><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,965 570.0,1010" fill="none" stroke="#334155" /><polyline stroke-width="2" marker-end="url(#arrow)" points="675,1060.0 805,1062.5" fill="none" stroke="#334155" /><rect x="728.0" y="1039.25" width="24" height="20" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="740.0" y="1053.25" fill="#334155">Yes</text><polyline stroke-width="2" marker-end="url(#arrow)" points="1075,1062.5 1155,1060 1155,430 720,430.0" fill="none" stroke="#334155" /><rect x="1139.0" y="723.0" width="32" height="20" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="1155.0" y="737.0" fill="#334155">Next</text><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,1110 570.0,1170" fill="none" stroke="#334155" /><rect x="562.0" y="1118.0" width="16" height="20" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="570.0" y="1132.0" fill="#334155">No</text><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,1245 570.0,1305" fill="none" stroke="#334155" /><polyline stroke-width="2" marker-end="url(#arrow)" points="570.0,1375 570.0,1445" fill="none" stroke="#334155" /><rect stroke-width="2" x="420" y="45" width="300" height="55" rx="25" fill="#dcfce7" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="72.5" fill="#0f172a"><tspan x="570.0" dy="0">Operator selects workflow</tspan></text><rect stroke-width="2" x="420" y="135" width="300" height="60" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="154.0" fill="#0f172a"><tspan x="570.0" dy="0">Validate configuration / fixed</tspan><tspan x="570.0" dy="22">context</tspan></text><polygon stroke-width="2" points="570.0,235 675,287.5 570.0,340 465,287.5" fill="#fef3c7" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="287.5" fill="#0f172a"><tspan x="570.0" dy="0">Guided or replay?</tspan></text><rect stroke-width="2" x="65" y="260" width="285" height="75" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="207.5" y="286.5" fill="#0f172a"><tspan x="207.5" dy="0">Import manual data or display</tspan><tspan x="207.5" dy="22">recorded events</tspan></text><rect stroke-width="2" x="420" y="395" width="300" height="70" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="419.0" fill="#0f172a"><tspan x="570.0" dy="0">Reserve cost; obtain K bot</tspan><tspan x="570.0" dy="22">samples</tspan></text><rect stroke-width="2" x="420" y="505" width="300" height="70" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="529.0" fill="#0f172a"><tspan x="570.0" dy="0">Validate source; create equal</tspan><tspan x="570.0" dy="22">slot schedule</tspan></text><rect stroke-width="2" x="420" y="615" width="300" height="70" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="639.0" fill="#0f172a"><tspan x="570.0" dy="0">Evaluate accepted bots in</tspan><tspan x="570.0" dy="22">isolated runner</tspan></text><polygon stroke-width="2" points="570.0,725 685,782.5 570.0,840 455,782.5" fill="#fef3c7" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="782.5" fill="#0f172a"><tspan x="570.0" dy="0">All slots scoreable?</tspan></text><rect stroke-width="2" x="805" y="745" width="270" height="75" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="940.0" y="771.5" fill="#0f172a"><tspan x="940.0" dy="0">Checkpoint / pause; report</tspan><tspan x="940.0" dy="22">partial status</tspan></text><rect stroke-width="2" x="420" y="895" width="300" height="70" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="919.0" fill="#0f172a"><tspan x="570.0" dy="0">Calculate 70/30 fitness; rank</tspan><tspan x="570.0" dy="22">prompts</tspan></text><polygon stroke-width="2" points="570.0,1010 675,1060.0 570.0,1110 465,1060.0" fill="#fef3c7" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="1060.0" fill="#0f172a"><tspan x="570.0" dy="0">More generations?</tspan></text><rect stroke-width="2" x="805" y="1025" width="270" height="75" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="940.0" y="1051.5" fill="#0f172a"><tspan x="940.0" dy="0">Select / mutate / cross; save</tspan><tspan x="940.0" dy="22">lineage</tspan></text><rect stroke-width="2" x="420" y="1170" width="300" height="75" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="1196.5" fill="#0f172a"><tspan x="570.0" dy="0">Freeze selection; fresh holdout</tspan><tspan x="570.0" dy="22">comparison</tspan></text><rect stroke-width="2" x="420" y="1305" width="300" height="70" rx="8" fill="#dbeafe" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="1329.0" fill="#0f172a"><tspan x="570.0" dy="0">Export reviewed evidence /</tspan><tspan x="570.0" dy="22">comparison</tspan></text><rect stroke-width="2" x="420" y="1445" width="300" height="55" rx="25" fill="#dcfce7" stroke="#334155" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" x="570.0" y="1472.5" fill="#0f172a"><tspan x="570.0" dy="0">Completed or explicitly partial</tspan></text><text font-family="Arial, sans-serif" font-size="15" x="35" y="1565" fill="#475569">Planned flow. Paid work requires verified isolation and explicit limits; incomplete work stays partial.</text></svg>
